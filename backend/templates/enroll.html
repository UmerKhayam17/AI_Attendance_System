<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face Enrollment</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { margin-bottom: .25rem; }
    .meta { color: #94a3b8; margin-bottom: 1.5rem; }
    video, canvas { width: 100%; border-radius: 12px; background: #000; }
    .controls { display: flex; gap: .75rem; margin: 1rem 0; flex-wrap: wrap; }
    button, a.link { border: none; border-radius: 8px; padding: .65rem 1rem; cursor: pointer; font-size: .95rem; }
    .primary { background: #3b82f6; color: white; }
    .success { background: #16a34a; color: white; }
    .ghost { background: #334155; color: white; }
    a.link { background: #475569; color: white; text-decoration: none; display: inline-block; }
    .status { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem; margin-top: 1rem; }
    .log { font-size: .85rem; color: #94a3b8; max-height: 160px; overflow-y: auto; margin-top: .75rem; }
    .progress { height: 8px; background: #334155; border-radius: 4px; margin-top: .75rem; }
    .bar { height: 100%; background: #3b82f6; border-radius: 4px; transition: width .3s; }
    .error { color: #f87171; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="link" href="/">← Back</a>
    <h1>Face Enrollment</h1>
    <p class="meta">Employee: <strong id="empId">—</strong> — Capture at least 5 quality face images, then train.</p>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" hidden></canvas>

    <div class="controls">
      <button class="primary" id="captureBtn">Capture Face</button>
      <button class="success" id="trainBtn" disabled>Train Embeddings</button>
      <button class="ghost" id="refreshBtn">Refresh Status</button>
    </div>

    <div class="status">
      <div>Images captured: <span id="count">0</span> / <span id="required">5</span></div>
      <div class="progress"><div class="bar" id="bar" style="width:0%"></div></div>
      <div style="margin-top:.75rem">Enrolled: <span id="enrolled">No</span> · Trained: <span id="trained">No</span></div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script>
    const employeeId = window.location.pathname.split("/").filter(Boolean).pop();
    document.getElementById("empId").textContent = employeeId;
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const logEl = document.getElementById("log");
    const REQUIRED = 5;

    function log(msg, ok = true) {
      const line = document.createElement("div");
      line.className = ok ? "ok" : "error";
      line.textContent = msg;
      logEl.prepend(line);
    }

    async function refreshStatus() {
      const res = await fetch(`/api/recognition/enroll/${employeeId}/`);
      if (!res.ok) { log("Employee enrollment not found", false); return; }
      const data = await res.json();
      document.getElementById("count").textContent = data.total_images;
      document.getElementById("enrolled").textContent = data.is_enrolled ? "Yes" : "No";
      document.getElementById("trained").textContent = data.is_trained ? "Yes" : "No";
      document.getElementById("bar").style.width = Math.min(100, (data.total_images / REQUIRED) * 100) + "%";
      document.getElementById("trainBtn").disabled = data.total_images < REQUIRED;
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
      video.srcObject = stream;
    }

    function snapBase64() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);
      return canvas.toDataURL("image/jpeg", 0.92);
    }

    document.getElementById("captureBtn").onclick = async () => {
      const image = snapBase64();
      const res = await fetch(`/api/recognition/enroll/${employeeId}/capture/`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image }),
      });
      const data = await res.json();
      if (res.ok && data.accepted) {
        log(`Captured image ${data.total_images} — ${data.quality.message}`);
        refreshStatus();
      } else {
        log(data.quality?.message || data.error || "Capture failed", false);
      }
    };

    document.getElementById("trainBtn").onclick = async () => {
      log("Training embeddings...");
      const res = await fetch(`/api/recognition/enroll/${employeeId}/train/`, { method: "POST" });
      const data = await res.json();
      if (res.ok) {
        log(`Training complete — ${data.images_used} images used`);
        refreshStatus();
      } else {
        log(data.error || "Training failed", false);
      }
    };

    document.getElementById("refreshBtn").onclick = refreshStatus;

    startCamera().catch(() => log("Camera access denied", false));
    refreshStatus();
  </script>
</body>
</html>
